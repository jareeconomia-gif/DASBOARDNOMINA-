databases:
  - name: subtec-nomina-db
    plan: free
    databaseName: subtec_nomina
    user: subtec_nomina

services:
  - type: web
    name: subtec-nomina-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: subtec-nomina-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
